<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Gael Uyuumil Cordero Chavez">
    <link rel="stylesheet" href="css/estilos.css">

    <title>Contáctame</title>
</head>

<body>

    <form class="formulario">
        <fieldset class="formularioPrincipal">
            <legend>
                <strong><em>Contáctame</em></strong>
            </legend>
            <fieldset class="seccionFormulario">
                <legend><em>Nombre</em></legend>
                <div class="campo">
                    <label for="Nombre">Nombre:</label>
                    <input id="Nombre" type="text" name="Nombre" placeholder="Escribe tu nombre">
                </div>
                <div class="campo">
                    <label for="Apellido">Apellido:</label>
                    <input id="Apellido" type="text" name="Apellido" placeholder="Escribe tu apellido">
                </div>
            </fieldset>
            <fieldset class="seccionFormulario">
                <legend><em>Género</em></legend>
                <div class="opciones">
                    <label>
                        <input type="radio" name="Genero" id="Masculino">
                        Masculino
                    </label>
                    <label>
                        <input type="radio" name="Genero" id="Femenino">
                        Femenino
                    </label>
                </div>
            </fieldset>
            <fieldset class="seccionFormulario">
                <legend><em>Intereses</em></legend>
                <div class="opciones">
                    <label>
                        <input type="checkbox" name="Deportes" value="deportes">
                        Hacer deporte
                    </label>
                    <label>
                        <input type="checkbox" name="Television" value="Television">
                        Ver televisión
                    </label>
                    <label>
                        <input type="checkbox" name="Ejercicio" value="ejercicio">
                        Hacer ejercicio
                    </label>
                    <label>
                        <input type="checkbox" name="Warhammer" value="warhammer">
                        Warhammer
                    </label>
                </div>
            </fieldset>
            <fieldset class="seccionFormulario">
                <legend><em>Escolaridad</em></legend>
                <label for="Escolaridad">
                    Selecciona tu escolaridad:
                </label>
                <select name="Escolaridad" id="Escolaridad">
                    <option value="bachillerato">Bachillerato</option>
                    <option value="universidad">Universidad</option>
                    <option value="secundaria">Secundaria</option>
                </select>
            </fieldset>
            <fieldset class="seccionFormulario">
                <legend><em>Navegador usado</em></legend>
                <label for="MisBuscadores">
                    Selecciona el navegador utilizado:
                </label>
                <input list="buscadores" name="MisBuscadores" id="MisBuscadores" placeholder="Ej. Chrome">
                <datalist id="buscadores">
                    <option value="Chrome">
                    <option value="Firefox">
                    <option value="Internet Explorer">
                    <option value="Opera">
                    <option value="Safari">
                    <option value="Microsoft Edge">
                </datalist>
            </fieldset>
            <input class="botonEnviar" type="submit" value="Enviar">
        </fieldset>
    </form>
    <a href="Index.html" class="boton">
        Volver al index
    </a>
</body>
</html>
